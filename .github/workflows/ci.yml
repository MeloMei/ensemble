name: Build

"on":
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
